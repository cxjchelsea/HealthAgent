name: HealthAgent CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthagent
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: healthagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthagent -d healthagent"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m evals.runner
      - run: python -m evals.s2a_benchmark
      - run: python -m evals.s2b5_benchmark
      - run: python -m evals.s2c_benchmark
      - run: python -m compileall -q apps agent services evals
      # Block correctness errors now; format and full strict typing are tracked separately.
      - run: python -m ruff check --select E4,E7,E9,F63,F7,F82 .
      - run: python -m mypy agent/understanding.py --follow-imports=skip
      - name: PostgreSQL Alembic migrate and idempotent rerun
        env:
          DATABASE_URL: postgresql+psycopg://healthagent:ci_local_only@localhost:5432/healthagent
        run: |
          python -m services.migrate
          python -m services.migrate
          python -c "from sqlalchemy import create_engine,text; import os; e=create_engine(os.environ['DATABASE_URL']); assert e.connect().execute(text('select version_num from alembic_version')).scalar()=='0003_memory'"
