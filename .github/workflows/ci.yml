name: S0-S1 CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: python -m evals.runner
      - run: python -m compileall -q apps agent services evals
      # Formatting/lint enforcement is activated after initial ruff baseline is normalized.
