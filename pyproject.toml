[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "healthagent-s0-s1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8", "mypy>=1.12"]
[tool.setuptools.packages.find]
include=["agent*","apps*","services*","evals*"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
markers=["live: requires configured live LLM"]
[tool.ruff]
line-length=100
[tool.ruff.lint]
select=["E","F","I","B"]
