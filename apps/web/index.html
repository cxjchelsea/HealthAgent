<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealthAgent</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#e7eef5;background:#101826}
body{margin:0}main{max-width:880px;margin:auto;padding:26px 18px}
h1{margin:0}.hint,.status{color:#93a4bc;font-size:13px}
.panel{background:#182438;border:1px solid #344257;border-radius:12px;padding:18px;margin:16px 0}
#messages{height:55vh;overflow:auto;white-space:pre-wrap}
.msg{padding:10px 14px;margin:10px 0;background:#26374c;border-radius:8px;line-height:1.6}
.assistant{background:#1a3b43}
textarea{width:100%;height:90px;box-sizing:border-box;border:1px solid #516078;background:#101826;color:white;padding:12px;border-radius:8px}
button{padding:10px 20px;border:0;background:#36a9a5;color:#07171d;border-radius:7px;cursor:pointer}
button:disabled{opacity:.5}.toolbar{display:flex;gap:10px;align-items:center;margin-top:10px}
</style></head><body><main><h1>HealthAgent</h1>
<p class="hint" id="model-info">统一 Agent 对话 · 自主调用工具 · 有界历史上下文 · 最终 JSON 回复，暂不支持流式</p>
<section class="panel"><div id="messages" aria-live="polite"></div>
<textarea id="prompt" placeholder="输入消息（Ctrl + Enter 发送）"></textarea>
<div class="toolbar"><label class="hint"><input type="checkbox" id="memory-consent"> 本次允许 Agent 保存长期记忆</label></div><div class="toolbar"><button id="send">发送</button><button id="stop" disabled>停止等待</button>
<button id="new">新建对话</button><span class="status" id="status"></span></div></section><section class="panel"><h2>长期记忆管理</h2><p class="hint">按精确 Key 管理；含义相近但 Key 不同的记录不会自动合并。修改和删除均只作用于选定 Key。</p><button id="memory-refresh" type="button">刷新记忆</button><div id="memory-list" aria-live="polite"></div><p class="status" id="memory-status"></p></section></main><script>
const KEY='healthagent.s1.conversation.v1';
let conversation=null,controller=null;
const messages=document.querySelector('#messages'),prompt=document.querySelector('#prompt'),status=document.querySelector('#status');
const sendButton=document.querySelector('#send'),stopButton=document.querySelector('#stop');
function add(role,content){
 const d=document.createElement('div');d.className='msg '+role;
 d.textContent=(role==='user'?'你：':'Agent：')+content;
 messages.appendChild(d);messages.scrollTop=messages.scrollHeight;return d;
}
async function start(){
 const r=await fetch('/conversations',{method:'POST'});
 if(!r.ok)throw Error('创建会话失败：'+r.status);
 conversation=(await r.json()).id;localStorage.setItem(KEY,conversation);
 messages.replaceChildren();status.textContent='新对话已创建';
}
async function restore(){
 const saved=localStorage.getItem(KEY);
 if(!saved){await start();return;}
 try{
  const r=await fetch('/conversations/'+encodeURIComponent(saved));
  if(!r.ok){
   if(r.status===404||r.status===401){localStorage.removeItem(KEY);await start();return;}
   throw Error('恢复失败：HTTP '+r.status);
  }
  const data=await r.json();conversation=saved;messages.replaceChildren();
  for(const m of data.messages){
   if(m.role==='user'||m.role==='assistant'){
    if(m.role==='assistant'&&!['completed','partial'].includes(m.status))continue;
    const el=add(m.role,m.content||'');if(m.status!=='completed')el.dataset.status=m.status;
   }
  }
  status.textContent='已恢复会话历史';
 }catch(e){status.textContent='恢复失败：'+e.message;}
}
async function send(){
 const value=prompt.value.trim();
 if(!value||controller||!conversation)return;
 prompt.value='';add('user',value);
 const answer=add('assistant','运行中…');
 controller=new AbortController();sendButton.disabled=true;stopButton.disabled=false;
 status.textContent='Agent 正在执行…';
 const t=performance.now();
 try{
  const r=await fetch('/conversations/'+encodeURIComponent(conversation)+'/agent/messages',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({content:value,client_request_id:crypto.randomUUID(),
    memory_write_consent:document.querySelector('#memory-consent').checked}),
   signal:controller.signal
  });
  if(!r.ok)throw Error('HTTP '+r.status);
  const data=await r.json();
  answer.textContent='Agent：'+(data.answer||'（无最终回复）');
  const details=document.createElement('details');details.className='msg';
  const summary=document.createElement('summary');summary.textContent='执行步骤 · '+(data.trace?.length||0)+' 条';
  details.appendChild(summary);
  for(const step of data.trace||[]){
   const line=document.createElement('div');line.className='hint';
   if(step.type==='decision')line.textContent='第 '+step.step+' 轮决策：'+(step.tools||[]).join(', ');
   else if(step.type==='tool')line.textContent='第 '+step.step+' 轮工具 '+step.name+': '+(step.ok?'成功':'失败');
   else line.textContent='第 '+step.step+' 轮：'+step.type;
   details.appendChild(line);
  }
  messages.appendChild(details);
  document.querySelector('#memory-consent').checked=false;
  status.textContent='Agent '+data.status+' · '+((performance.now()-t)/1000).toFixed(1)+' 秒';
 }catch(e){
  answer.textContent='Agent：本次请求未确认完成';
  status.textContent=e.name==='AbortError'?'已停止等待（不保证服务端已取消）':'请求失败：'+e.message;
 }finally{controller=null;sendButton.disabled=false;stopButton.disabled=true;}
}
// Explicit owner-scoped memory CRUD. All values are inserted as text, never HTML.
const memoryList=document.querySelector('#memory-list');
const memoryStatus=document.querySelector('#memory-status');
async function memoryRequest(url,options){
 const r=await fetch(url,options);
 if(!r.ok)throw Error('HTTP '+r.status);
 return r.status===204?null:r.json();
}
async function refreshMemories(){
 memoryStatus.textContent='正在加载记忆…';
 try{
  const items=await memoryRequest('/memories');
  memoryList.replaceChildren();
  if(!items.length){memoryList.textContent='当前没有长期记忆。';}
  for(const item of items){
   const line=document.createElement('div');line.className='msg';
   const key=document.createElement('div');key.className='hint';key.textContent='Key：'+item.key;
   const value=document.createElement('input');value.type='text';value.value=item.value;value.maxLength=500;
   value.setAttribute('aria-label','记忆值：'+item.key);
   value.style.cssText='width:100%;box-sizing:border-box;padding:8px;margin:8px 0;background:#101826;color:white;border:1px solid #516078;border-radius:5px';
   const save=document.createElement('button');save.type='button';save.textContent='保存修改';
   save.onclick=async()=>{
    if(!value.value.trim()){memoryStatus.textContent='记忆值不能为空';return;}
    try{
     await memoryRequest('/memories/'+encodeURIComponent(item.key),{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({value:value.value})});
     memoryStatus.textContent='已保存 Key：'+item.key;
     await refreshMemories();
    }catch(e){memoryStatus.textContent='保存失败：'+e.message;}
   };
   const remove=document.createElement('button');remove.type='button';remove.textContent='删除';
   remove.style.marginLeft='8px';
   remove.onclick=async()=>{
    if(!confirm('确定删除长期记忆 '+item.key+' 吗？此操作无法撤销。'))return;
    try{
     await memoryRequest('/memories/'+encodeURIComponent(item.key),{method:'DELETE'});
     await refreshMemories();
    }catch(e){memoryStatus.textContent='删除失败：'+e.message;}
   };
   line.append(key,value,save,remove);memoryList.appendChild(line);
  }
  memoryStatus.textContent='共 '+items.length+' 条记忆；不同 Key 不会自动合并。';
 }catch(e){memoryStatus.textContent='加载失败：'+e.message;}
}
document.querySelector('#memory-refresh').onclick=refreshMemories;
refreshMemories();
sendButton.onclick=send;
stopButton.onclick=()=>controller?.abort();
document.querySelector('#new').onclick=()=>{
 if(controller){status.textContent='请先等待请求结束';return;}
 start().catch(e=>status.textContent=e.message);
};
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)send();});
fetch('/model').then(r=>r.ok?r.json():null).then(m=>{
 if(m)document.querySelector('#model-info').textContent='统一 Agent · Provider: '+m.provider+' · Model: '+m.model+' · 非流式回复';
}).catch(()=>{});
restore();
</script></body></html>
